{% extends "core/base_dashboard.html" %}

{% block content %}

<div class="flex min-h-[60vh] items-center justify-center">

    <div class="text-center">

        <div class="mb-6 text-6xl">
            ✓
        </div>

        <h1 class="text-2xl font-bold text-gray-800">
            ¡Registro completado!
        </h1>

        <p class="mt-3 text-gray-600">
            Tu registro del día {{ fecha }} se ha completado correctamente.
        </p>

        <p class="mt-2 text-gray-600">
            Gracias, {{ nombre_usuario }}.
        </p>

        <div class="mt-6">
            <a href="{% url 'ventas:venta_diaria_create' %}" class="inline-block bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">
                Crear un nuevo registro
            </a>    
        </div>

    </div>

</div>

{% endblock %}
