{% extends "core/base_dashboard.html" %}

{% block content %}

<div class="max-w-lg mx-auto">

    <div class="bg-white rounded-xl shadow p-8">

        <h1 class="text-2xl font-bold text-red-600 mb-6">

            Eliminar venta

        </h1>

        <p class="text-gray-700 mb-8">

            ¿Estás seguro de eliminar la venta del día

            <strong>{{ object.fecha }}</strong>

            de la sucursal

            <strong>{{ object.sucursal }}</strong>?

        </p>

        <form method="post">

            {% csrf_token %}

            <div class="flex justify-end gap-3">

                <a
                    href="{% url 'ventas:venta_diaria_list' %}"
                    class="border border-gray-300 px-5 py-2 rounded-lg hover:bg-gray-100"
                >
                    Cancelar
                </a>

                <button
                    type="submit"
                    class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg"
                >
                    Eliminar
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
