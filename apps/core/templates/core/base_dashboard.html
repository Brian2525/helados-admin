{% load static %}

<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}
            ERP Helados
        {% endblock %}

    </title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100">

<div class="flex min-h-screen">

    {% include "core/components/sidebar.html" %}

    <main class="flex-1 flex flex-col">

        {% include "core/components/header.html" %}

        <section class="flex-1 p-8 overflow-y-auto">

            {% block content %}
            {% endblock %}

        </section>

    </main>

    <button
    type="button"
    onclick="abrirFeedback()"
    class="fixed bottom-5 right-5 z-40
           rounded-full bg-gray-900
           px-4 py-3 text-sm text-white
           shadow-lg hover:bg-gray-800"
>
    🐛 Reportar problema
</button>
</div>
{% include "feedback/modal.html" %}
<script src="{% static 'feedback/js/feedback_modal.js' %}"></script>

</body>





</html>
